从零开始，创建你的技术博客</textarea></section></section><section><section data-markdown><textarea data-template>## 目录

1. **系统概览** - 了解博客架构
2. **快速开始** - 安装与运行
3. **内容创作** - 文章编写指南
4. **特色功能** - Markdown 增强
5. **幻灯片** - 创建演示文稿
6. **配置定制** - 个性化设置
7. **部署上线** - 发布到互联网</textarea></section></section><section><section data-markdown><textarea data-template># 第一章

## 系统概览</textarea></section><section data-markdown><textarea data-template>## 技术栈

| 技术 | 用途 |
|------|------|
| **Astro 5** | 静态站点生成器 |
| **Vue 3** | 交互式组件 |
| **TypeScript** | 类型安全 |
| **Tailwind CSS** | 样式系统 |
| **Reveal.js** | 幻灯片演示 |</textarea></section><section data-markdown><textarea data-template>## 主要特性

&lt;p class=&quot;fragment&quot;&gt;Markdown &amp; MDX 支持&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;代码高亮 (100+ 语言)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;数学公式 (LaTeX/KaTeX)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;流程图 (Mermaid)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;数据可视化 (ECharts)&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;幻灯片演示 (Reveal.js)&lt;/p&gt;</textarea></section><section data-markdown><textarea data-template>## 目录结构

```
blog/
├── content/           # 内容目录
│   ├── posts/        # 博客文章
│   ├── pages/        # 静态页面
│   └── slides/       # 独立幻灯片
├── src/
│   ├── config/       # 配置文件
│   ├── components/   # 组件
│   ├── layouts/      # 布局模板
│   └── plugins/      # Markdown 插件
└── public/           # 静态资源
```</textarea></section></section><section><section data-markdown><textarea data-template># 第二章

## 快速开始</textarea></section><section data-markdown><textarea data-template>## 环境要求

- **Node.js** 18.0 或更高版本
- **npm** 或 **pnpm** 包管理器
- 代码编辑器 (推荐 VS Code)</textarea></section><section data-markdown><textarea data-template>## 安装步骤

```bash
# 1. 克隆项目
git clone &lt;repository-url&gt;

# 2. 进入目录
cd astro-blog

# 3. 安装依赖
npm install

# 4. 启动开发服务器
npm run dev
```</textarea></section><section data-markdown><textarea data-template>## 常用命令

| 命令 | 说明 |
|------|------|
| `npm run dev` | 启动开发服务器 |
| `npm run build` | 构建生产版本 |
| `npm run preview` | 预览构建结果 |

访问 `http://localhost:4321` 查看博客</textarea></section></section><section><section data-markdown><textarea data-template># 第三章

## 内容创作</textarea></section><section data-markdown><textarea data-template>## 创建文章

在 `content/posts/` 目录下创建 `.md` 文件：

```
content/posts/
├── my-first-post.md      # 根目录文章
├── tutorial/
│   ├── README.md         # 目录首页
│   └── getting-started.md
└── projects/
    └── project-a.md
```</textarea></section><section data-markdown><textarea data-template>## Frontmatter 配置

每篇文章必须以 YAML 格式的元数据开头：

```yaml</textarea></section></section><section><section data-markdown><textarea data-template>title: 文章标题（必填）
description: 文章描述
pubDate: 2025-01-05
author: 作者名
tags: [标签1, 标签2]
categories: [分类]
draft: false
star: false</textarea></section></section><section><section data-markdown><textarea data-template>```</textarea></section><section data-markdown><textarea data-template>## 必填与可选字段

| 字段 | 必填 | 说明 |
|------|:----:|------|
| `title` | ✅ | 文章标题 |
| `pubDate` | ✅ | 发布日期 |
| `description` | - | SEO 描述 |
| `author` | - | 作者名 |
| `tags` | - | 标签列表 |
| `categories` | - | 分类 |
| `draft` | - | 草稿状态 |</textarea></section><section data-markdown><textarea data-template>## URL 映射规则

文件路径决定访问 URL：

| 文件路径 | 访问 URL |
|----------|----------|
| `posts/hello.md` | `/posts/hello` |
| `posts/guide/intro.md` | `/posts/guide/intro` |
| `posts/guide/README.md` | `/posts/guide` |</textarea></section></section><section><section data-markdown><textarea data-template># 第四章

## 特色功能</textarea></section><section data-markdown><textarea data-template>## 提示容器

六种预设容器样式：

```markdown
::: tip 提示
这是一个提示信息
:::

::: warning 警告
这是警告信息
:::

::: danger 危险
这是危险警告
:::
```</textarea></section><section data-markdown><textarea data-template>## 容器类型一览

| 类型 | 图标 | 用途 |
|------|------|------|
| `tip` | 💡 | 技巧建议 |
| `info` | ℹ️ | 补充信息 |
| `note` | 📝 | 重要备注 |
| `warning` | ⚠️ | 警告提醒 |
| `danger` | 🚨 | 危险警示 |
| `details` | 📋 | 可折叠内容 |</textarea></section><section data-markdown><textarea data-template>## 代码高亮

支持 100+ 种编程语言：

````markdown
```javascript
function hello(name) {
  console.log(`Hello, ${name}!`);
}
```

```python
def hello(name):
    print(f&quot;Hello, {name}!&quot;)
```
````</textarea></section><section data-markdown><textarea data-template>## 数学公式

使用 LaTeX 语法：

**行内公式：** `$E = mc^2$`

**块级公式：**
```latex
$$
\int_{-\infty}^{\infty} e^{-x^2} dx = \sqrt{\pi}
$$
```</textarea></section><section data-markdown><textarea data-template>## Mermaid 流程图

````markdown
```mermaid
graph TD
    A[开始] --&gt; B{条件判断}
    B --&gt;|是| C[执行操作]
    B --&gt;|否| D[跳过]
    C --&gt; E[结束]
    D --&gt; E
```
````</textarea></section><section data-markdown><textarea data-template>## Mermaid 图表类型

- **流程图** - `graph TD/LR/BT/RL`
- **时序图** - `sequenceDiagram`
- **类图** - `classDiagram`
- **甘特图** - `gantt`
- **饼图** - `pie`
- **状态图** - `stateDiagram-v2`</textarea></section><section data-markdown><textarea data-template>## ECharts 图表

在幻灯片中支持交互式图表：

````markdown
```echarts
{
  &quot;xAxis&quot;: { &quot;type&quot;: &quot;category&quot;, &quot;data&quot;: [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;] },
  &quot;yAxis&quot;: { &quot;type&quot;: &quot;value&quot; },
  &quot;series&quot;: [{ &quot;data&quot;: [120, 200, 150], &quot;type&quot;: &quot;bar&quot; }]
}
```
````</textarea></section></section><section><section data-markdown><textarea data-template># 第五章

## 幻灯片演示</textarea></section><section data-markdown><textarea data-template>## 三种使用方式

| 方式 | 位置 | 说明 |
|------|------|------|
| 独立幻灯片 | `content/slides/` | 专门的演示页面 |
| 文章内幻灯片 | `content/posts/` | `layout: slides` |
| 嵌入式幻灯片 | `.mdx` 文件 | `&lt;Slides&gt;` 组件 |</textarea></section><section data-markdown><textarea data-template>## 方式一：独立幻灯片

在 `content/slides/` 创建文件：

```markdown</textarea></section></section><section><section data-markdown><textarea data-template>title: 我的演示
theme: black
slideNumber: true</textarea></section></section><section><section data-markdown><textarea data-template># 第一页

内容...</textarea></section></section><section><section data-markdown><textarea data-template># 第二页

使用 `---` 分隔幻灯片
```</textarea></section><section data-markdown><textarea data-template>## 方式二：文章内幻灯片

在 frontmatter 中设置 `layout: slides`：

```yaml</textarea></section></section><section><section data-markdown><textarea data-template>title: 技术分享
pubDate: 2025-01-05
layout: slides
theme: white
transition: fade</textarea></section></section><section><section data-markdown><textarea data-template>```

整篇文章将渲染为幻灯片</textarea></section><section data-markdown><textarea data-template>## 方式三：嵌入幻灯片

在 `.mdx` 文件中使用组件：

```jsx
import Slides from &#39;@/components/media/Slides.astro&#39;;

&lt;Slides src=&quot;/slides/demo&quot; height=&quot;400px&quot; /&gt;

// 或内联内容
&lt;Slides height=&quot;400px&quot;&gt;
# 标题
内容...
&lt;/Slides&gt;
```</textarea></section><section data-markdown><textarea data-template>## 幻灯片分隔符

| 分隔符 | 方向 | 说明 |
|--------|------|------|
| `---` | 水平 ➡️ | 主线内容 |
| `----` | 垂直 ⬇️ | 章节子内容 |

```markdown
# 第一章 (按 →)</textarea></section></section><section><section data-markdown><textarea data-template># 第二章</textarea></section><section data-markdown><textarea data-template>## 2.1 详细 (按 ↓)</textarea></section><section data-markdown><textarea data-template>## 2.2 更多</textarea></section></section><section><section data-markdown><textarea data-template># 第三章
```</textarea></section><section data-markdown><textarea data-template>## 可用主题

| 主题 | 风格 |
|------|------|
| `black` | 黑色背景（默认） |
| `white` | 白色背景 |
| `league` | 深灰商务风 |
| `night` | 深蓝夜间模式 |
| `solarized` | 开发者配色 |
| `moon` | 深蓝月光风 |</textarea></section><section data-markdown><textarea data-template>## 快捷键

| 按键 | 功能 |
|------|------|
| `→` / `Space` | 下一页 |
| `←` | 上一页 |
| `↑` / `↓` | 垂直导航 |
| `Esc` / `O` | 概览模式 |
| `F` | 全屏 |
| `S` | 演讲者视图 |</textarea></section></section><section><section data-markdown><textarea data-template># 第六章

## 配置定制</textarea></section><section data-markdown><textarea data-template>## 站点配置

编辑 `src/config/site.ts`：

```typescript
export const siteConfig = {
  title: &quot;我的博客&quot;,
  description: &quot;博客描述&quot;,
  author: &quot;作者名&quot;,
  email: &quot;email@example.com&quot;,
  avatar: &quot;/avatar.png&quot;,
}
```</textarea></section><section data-markdown><textarea data-template>## 社交链接

编辑 `src/config/social.ts`：

```typescript
export const socialLinks = [
  { name: &#39;GitHub&#39;, url: &#39;https://github.com/xxx&#39; },
  { name: &#39;Twitter&#39;, url: &#39;https://twitter.com/xxx&#39; },
  { name: &#39;Email&#39;, url: &#39;mailto:xxx@example.com&#39; },
]
```</textarea></section><section data-markdown><textarea data-template>## 导航菜单

编辑 `src/config/menu.ts`：

```typescript
export const menuItems = [
  { title: &#39;首页&#39;, path: &#39;/&#39; },
  { title: &#39;博客&#39;, path: &#39;/posts&#39; },
  { title: &#39;关于&#39;, path: &#39;/about&#39; },
]
```</textarea></section></section><section><section data-markdown><textarea data-template># 第七章

## 部署上线</textarea></section><section data-markdown><textarea data-template>## 构建生产版本

```bash
# 构建
npm run build

# 本地预览
npm run preview
```

构建产物在 `dist/` 目录</textarea></section><section data-markdown><textarea data-template>## 部署平台

| 平台 | 特点 |
|------|------|
| **Vercel** | 零配置，自动部署 |
| **Netlify** | 功能丰富，CDN 加速 |
| **GitHub Pages** | 免费，适合开源项目 |
| **Cloudflare Pages** | 全球 CDN，速度快 |</textarea></section><section data-markdown><textarea data-template>## Vercel 部署

1. 将代码推送到 GitHub
2. 在 Vercel 导入项目
3. 自动检测 Astro 框架
4. 点击 Deploy

每次 push 自动更新！</textarea></section><section data-markdown><textarea data-template>## GitHub Pages 部署

```yaml
# .github/workflows/deploy.yml
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm install &amp;&amp; npm run build
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
```</textarea></section></section><section><section data-markdown><textarea data-template># 总结</textarea></section><section data-markdown><textarea data-template>## 核心要点回顾

&lt;p class=&quot;fragment&quot;&gt;📁 内容放在 `content/posts/` 目录&lt;/p&gt;
&lt;p class=&quot;fragment&quot;&gt;📝 使用 Markdown + Frontmatter 编写&lt;/p&gt;

    </script> <!-- Reveal.js --> <script src="/slides/reveal.js"></script> <script src="/slides/plugin/markdown/markdown.js"></script> <script src="/slides/plugin/highlight/highlight.js"></script> <script src="/slides/plugin/notes/notes.js"></script> <script src="/slides/plugin/math/math.js"></script> <!-- Mermaid --> <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script> <!-- ECharts --> <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script> <!-- 初始化 Reveal.js --> <script>(function(){const revealConfig = "{\"hash\":true,\"controls\":true,\"progress\":true,\"center\":true,\"transition\":\"slide\",\"slideNumber\":true,\"markdown\":{\"smartypants\":true},\"plugins\":[\"RevealMarkdown\",\"RevealHighlight\",\"RevealNotes\",\"RevealMath\"]}";

      document.addEventListener('DOMContentLoaded', function() {
        const config = JSON.parse(revealConfig);

        Reveal.initialize({
          hash: config.hash,
          controls: config.controls,
          progress: config.progress,
          center: config.center,
          transition: config.transition,
          slideNumber: config.slideNumber,

          // Markdown 配置
          markdown: config.markdown,

          // 数学公式配置
          math: {
            mathjax: null,
            katex: 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
            katexScript: 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js',
          },

          // 插件
          plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX]
        }).then(function() {
          // Reveal.js 初始化完成后，渲染 Mermaid 和 ECharts
          var mermaidContainers = [];
          var echartsInstances = [];

          // 初始化 Mermaid
          if (typeof mermaid !== 'undefined') {
            mermaid.initialize({
              startOnLoad: false,
              theme: 'default',
              securityLevel: 'loose'
            });

            // 查找所有 mermaid 代码块并准备容器
            document.querySelectorAll('pre code.language-mermaid, pre code.mermaid').forEach(function(block, index) {
              var code = block.textContent;
              var container = document.createElement('div');
              container.className = 'mermaid';
              container.id = 'mermaid-slide-' + index;
              container.setAttribute('data-mermaid-code', code);
              container.style.minHeight = '100px';

              // 替换代码块
              var pre = block.parentElement;
              pre.parentElement.insertBefore(container, pre);
              pre.style.display = 'none';

              mermaidContainers.push({
                container: container,
                code: code,
                rendered: false
              });
            });

            // 渲染当前可见幻灯片中的 Mermaid
            async function renderVisibleMermaid() {
              var needsLayout = false;

              mermaidContainers.forEach(function(item) {
                if (item.rendered) return;

                var section = item.container.closest('section');
                if (section && (section.classList.contains('present') || section.closest('.present'))) {
                  item.container.textContent = item.code;
                  item.rendered = true;
                  needsLayout = true;
                }
              });

              // 渲染所有已标记的 Mermaid
              var toRender = mermaidContainers.filter(function(item) {
                return item.rendered && item.container.textContent;
              }).map(function(item) {
                return item.container;
              });

              if (toRender.length > 0) {
                try {
                  await mermaid.run({ nodes: toRender });
                  // Mermaid 渲染完成后，通知 Reveal.js 重新计算布局
                  if (needsLayout) {
                    Reveal.layout();
                  }
                } catch(e) {
                  console.warn('Mermaid render warning:', e);
                }
              }
            }

            // 初始渲染 - 使用更长的延迟确保 Reveal.js 完全初始化
            setTimeout(renderVisibleMermaid, 200);

            // 幻灯片切换时渲染
            Reveal.on('slidechanged', function() {
              setTimeout(renderVisibleMermaid, 50);
            });
          }

          // 初始化 ECharts
          if (typeof echarts !== 'undefined') {
            document.querySelectorAll('pre code.language-echarts, pre code.echarts').forEach(function(block, index) {
              try {
                var code = block.textContent.trim();
                var option = JSON.parse(code);

                // 创建 ECharts 容器
                var container = document.createElement('div');
                container.className = 'echarts-container';
                container.id = 'echarts-slide-' + index;
                container.style.height = '400px';
                container.style.width = '100%';

                // 替换代码块
                var pre = block.parentElement;
                pre.parentElement.insertBefore(container, pre);
                pre.style.display = 'none';

                echartsInstances.push({
                  container: container,
                  option: option,
                  chart: null,
                  initialized: false
                });
              } catch (e) {
                console.error('ECharts parsing error:', e);
              }
            });

            // 渲染当前可见幻灯片中的 ECharts
            function renderVisibleEcharts() {
              echartsInstances.forEach(function(item) {
                var section = item.container.closest('section');
                var isVisible = section && (section.classList.contains('present') || section.closest('.present'));

                if (isVisible) {
                  if (!item.initialized) {
                    item.chart = echarts.init(item.container);
                    item.chart.setOption(item.option);
                    item.initialized = true;
                  } else if (item.chart) {
                    item.chart.resize();
                  }
                }
              });
            }

            // 初始渲染
            setTimeout(renderVisibleEcharts, 100);

            // 幻灯片切换时渲染/调整大小
            Reveal.on('slidechanged', function() {
              setTimeout(renderVisibleEcharts, 50);
            });

            // 监听窗口大小变化
            window.addEventListener('resize', function() {
              echartsInstances.forEach(function(item) {
                if (item.chart) {
                  item.chart.resize();
                }
              });
            });
          }

        });
      });
    })();</script> </body> </html>
